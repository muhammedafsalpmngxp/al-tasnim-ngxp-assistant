intents:
  well_count:
    description: Count how many wells match a categorical filter. Use filter_column
      and filter_value to filter by rig name, well type, location, or status value
      (e.g. filter_column=rig_no filter_value=SWER101, or filter_column=location_preparation_status_in_progress_completed
      filter_value=Completed). Do NOT use for numeric range filters — use progress_range
      for that.
    sql_type: count
    allowed_filter_columns:
    - rig_no
    - well_type
    - well_location
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
    - flow_line_commi_status_in_progress_completed
  well_list:
    description: List wells with key operational fields, optionally filtered by rig,
      well type, or status. Use filter_column and filter_value to narrow results.
    sql_type: list
    order_by: over_all_progress_percentages DESC
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_type
    - over_all_progress_percentages
    - location_preparation_status_in_progress_completed
    - actual_rig_on_date
    - actual_rig_off_date
    default_limit: 20
    allowed_filter_columns:
    - rig_no
    - well_type
    - well_location
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
  progress_range:
    description: COUNT (not list) wells whose overall progress percentage falls within
      a numeric range. Use min_pct and max_pct on a 0-100 scale (e.g. min_pct=0 max_pct=50
      for below 50%). For LISTING wells by progress use progress_list instead.
    sql_type: range
    range_column: over_all_progress_percentages
  progress_list:
    description: LIST wells filtered by progress percentage. Use when the user wants
      to SEE individual wells above or below a progress threshold (e.g. "list wells
      below 50%", "show wells above 80%"). Use min_pct and max_pct on 0-100 scale.
    sql_type: range_list
    range_column: over_all_progress_percentages
    order_by: over_all_progress_percentages ASC
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_type
    - over_all_progress_percentages
    - location_preparation_status_in_progress_completed
    default_limit: 20
  rig_summary:
    description: Per-rig breakdown — well counts and average progress per rig. Use
      ONLY for well counts per rig; use progress_summary for highest/lowest progress.
    sql_type: group_by
    default_group_by: rig_no
    aggregate_column: over_all_progress_percentages
    default_limit: 10
  progress_summary:
    description: Which rig/well_type/week has the highest or lowest average progress.
    sql_type: group_by
    aggregate_column: over_all_progress_percentages
    allowed_group_by:
    - rig_no
    - well_type
    - week_number
    default_limit: 20
  top_wells:
    description: Top or bottom N wells ranked by overall progress percentage.
    sql_type: ranked
    rank_column: over_all_progress_percentages
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_type
    - over_all_progress_percentages
    default_limit: 10
  status_breakdown:
    description: Count wells grouped by a status column (location prep, flowline construction,
      commissioning).
    sql_type: status_breakdown
    allowed_status_columns:
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
    - flow_line_commi_status_in_progress_completed
  well_detail:
    description: Full details for a specific well, looked up by well name or PDO well
      ID.
    sql_type: detail
    id_column: pdo_well_id
    name_column: well_name_after_spud
    fast_path_keywords:
    - details for well
    - well details
    - show details for
    - info for well
    - well info
    fast_path_extract: well_name
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_location
    - well_type
    - pdo_well_id
    - over_all_progress_percentages
    - actual_rig_on_date
    - actual_rig_off_date
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
    - flow_line_commi_status_in_progress_completed
  activity_lookup:
    description: Look up activity details — production norms, qty/hr, duration, crew
      group, UOM — filtered by activity code, discipline, or keyword.
    sql_type: multi_filter
    table: activity_master
    order_by: activity_code
    fast_path_keywords:
    - activity code
    - qty/hr
    - qty per hour
    - production norm
    - productivity norm
    - activity master
    - norm for activity
    fast_path_extract: activity_code
    known_discipline_values:
    - civil
    - mechanical
    - electrical
    - e&i
    select_columns:
    - discipline
    - activity_group_description
    - activity_code
    - activity_description
    - crew_group_name
    - duration_for_activity
    - duration_hrs
    - uom
    - qty_hr
    allowed_filter_columns:
    - activity_code
    - discipline
    - crew_group_name
    - activity_group_description
    default_limit: 10
  nimr_detail:
    description: Nimr cluster well details — buffer status, progress, rig, pegged
      date, construction dates. Use for buffer status, nimr cluster, or Nimr-specific
      well queries.
    sql_type: multi_filter
    table: wmr_nimr
    order_by: rig_no
    fast_path_keywords:
    - buffer status
    - buffer
    - nimr cluster
    fast_path_extract: pdo_well_id
    select_columns:
    - rig_no
    - well_location
    - well_name_after_spud
    - pdo_well_id
    - well_type
    - buffer_status
    - actual_pegged_date
    - cum_progress_for_this_week
    - last_week_cum_progress
    - actual_rig_on_date
    - actual_rig_off_date
    - latest_exp_rig_on_location_sap_data
    allowed_filter_columns:
    - pdo_well_id
    - rig_no
    - well_location
    - buffer_status
    - well_type
    default_limit: 20
  nimr_buffer_count:
    description: Count Nimr wells grouped by buffer status (drilled, ROL, Buffer1,
      Buffer2). Use for questions like "how many wells are in ROL status".
    sql_type: count_by_column
    table: wmr_nimr
    group_column: buffer_status
    fast_path_keywords:
    - buffer breakdown
    - buffer count
    - how many buffer
  kpi_lookup:
    description: Well Delivery Core KPIs — 13 metrics comparing Nimr vs Marmul for
      pegged locations, FLAFs, rig-on dates, and delivery milestones.
    sql_type: multi_filter
    table: well_delivery_kpis
    order_by: sr_no
    fast_path_keywords:
    - kpi
    - flaf
    - pegged
    - rig on location
    - 90 days
    - kpi count
    - delivery kpi
    - marmul count
    - nimr count
    select_columns:
    - sr_no
    - kpis
    - nimr_count
    - marmul_count
    allowed_filter_columns:
    - sr_no
    - kpis
    default_limit: 13
  crew_lookup:
    description: Crew group details — name, formation, PG/EG code, quantity, critical/support
      category, weightage.
    sql_type: multi_filter
    table: crew_master
    order_by: crew_group_name
    fast_path_keywords:
    - crew group
    - crew master
    - crew composition
    - crew formation
    - pg eg code
    - pg code
    - crew for
    - which crew
    - crew list
    select_columns:
    - crew_group_name
    - crew_formation
    - pg_eg_code
    - pg_eg_text
    - qty
    - critical_support
    - weightage
    allowed_filter_columns:
    - crew_group_name
    - pg_eg_code
    - critical_support
    default_limit: 20
  well_master_lookup:
    description: Nimr 2026 well master — field, well location, rig, well ID, and well
      function (Oil Producer / Water Injector).
    sql_type: multi_filter
    table: well_master
    order_by: field, well_id
    fast_path_keywords:
    - well master
    - nimr 2026
    - oil producer
    - water injector
    - well function
    select_columns:
    - station_code
    - field
    - well_location
    - rig_no
    - well_id
    - well_function
    allowed_filter_columns:
    - field
    - rig_no
    - well_id
    - well_function
    default_limit: 20
  field_wells:
    description: Operational wells by field or rig — covers all fields and rigs. Use
      for which wells are in a specific field or which rigs operate in a field.
    sql_type: multi_filter
    table: operational_wells
    order_by: field, rig_no
    fast_path_keywords:
    - which field
    - wells in field
    - field wells
    - rig in field
    - well location in
    - station code
    - well function
    select_columns:
    - well_id
    - station_code
    - field
    - well_location
    - rig_no
    - well_function
    - well_type
    allowed_filter_columns:
    - field
    - rig_no
    - well_function
    - well_type
    default_limit: 20
  milestone_status:
    description: Milestone and activity completion per well (44,235 records). progress=1.0
      means done, 0.0 means pending. Use for milestone status queries.
    sql_type: multi_filter
    table: operational_tasks
    order_by: well_id, code
    fast_path_keywords:
    - milestone status
    - task status
    - flowline start
    - flowline finish
    - hook up start
    - hook up finish
    - rig-on status
    - rig-off status
    - ms1000
    - mil2000
    - flcv
    - surveying status
    - milestones for well
    - tasks for well
    fast_path_extract: well_id
    select_columns:
    - well_id
    - code
    - text
    - type
    - progress
    - start_date
    - end_date
    allowed_filter_columns:
    - well_id
    - code
    - type
    default_limit: 30
