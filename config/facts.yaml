facts:

  # ── Well task plan milestones ───────────────────────────────────────────────
  - text: >
      AL TASNIM well task plan milestone definitions:
      M-90 represents the start of Location Preparation phase, approximately 90 days before Rig-On.
      M-60 is an intermediate checkpoint 60 days before Rig-On.
      M-30 is a checkpoint 30 days before Rig-On.
      M-19 is a checkpoint 19 days before Rig-On.
      M-2 is 2 days before Rig-On.
      M-1 is 1 day before Rig-On.
      M1 = Location Preparation complete — first positive milestone after Rig-On planning baseline.
      M2 = Cellar complete — final on-plot prerequisite before drilling begins.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Milestones"
    category: well_operations

  - text: >
      M-90 milestone in AL TASNIM well task plan: M-90 represents Location Preparation.
      The M-90 milestone marks the beginning of the Location Preparation phase,
      occurring approximately 90 days before the Rig-On date.
      Location Preparation activities start at M-90.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Milestones"
    category: well_operations

  - text: >
      The final on-plot prerequisite before drilling in the AL TASNIM well task plan is Cellar construction.
      M2 = Cellar complete. Cellar completion is the last on-plot activity that must be finished before
      drilling can begin. No drilling starts until the cellar is complete.
      Cellar is the final prerequisite before spud.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Milestones"
    category: well_operations

  - text: >
      Difference between M-1 and M1 in the AL TASNIM well task plan:
      M-1 (minus one) is a NEGATIVE milestone — it occurs 1 day BEFORE Rig-On. It is a final pre-rig checkpoint.
      M1 (positive one, no minus sign) is a POSITIVE milestone — it occurs AFTER Rig-On planning baseline
      and marks Location Preparation complete.
      M-1 = pre-rig (one day before rig arrives). M1 = post-baseline (location prep done).
      The minus sign is critical: negative milestones (M-90 through M-1) are countdowns before the rig arrives.
      Positive milestones (M1, M2) are achievements after the rig arrives.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Milestones"
    category: well_operations

  # ── Strategy ────────────────────────────────────────────────────────────────
  - text: >
      AL TASNIM competitive advantage in well delivery: AL TASNIM aims to finish wells faster
      using the same resources. The goal is completing more wells per year by reducing cycle time.
      Well delivery performance is tracked against a 3-year historical baseline.
      Faster well completion with the same rig count is the core competitive advantage sought.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Strategy"
    category: well_operations

  # ── Project scope ───────────────────────────────────────────────────────────
  - text: >
      NGXP Phase 1 does NOT include AI, LLM, or GenAI components.
      Phase 1 scope is limited to well delivery optimization, operational data integration,
      KPI dashboards, and well task plan performance monitoring — all using structured data only.
      No AI engine, no language model, and no generative AI features are part of Phase 1.
      AI and LLM capabilities are planned for Phase 3, which covers the AL TASNIM Sovereign AI engine.
      Therefore the answer to whether Phase 1 includes AI or LLM is: No.
    source: "NGXP Phase1 Master Guide 22May2026.docx"
    sheet: "Scope"
    category: project_scope
