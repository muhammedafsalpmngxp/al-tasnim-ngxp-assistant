# ── Defaults ─────────────────────────────────────────────────────────────────
# default_table / default_source_file: fallback used when an intent does not
# declare its own table. Change these if the primary query table changes.
# Never put column names here — those live in each intent's config below.
default_table: well_monitoring
default_source_file: POC 1 WellMonitoringReport_Feb_Data_VERIFIED.csv
max_rows: 50

# ── Extraction patterns (used by Python — do not hardcode these in .py files) ──
# rig_id: regex that matches a rig identifier in a user question
patterns:
  rig_id: '\b(swer\w+|swerig\w+)\b'

# ── Routing: words that force RAG instead of SQL ──────────────────────────────
# Add any domain term that should always go to document retrieval, never SQL.
exclude_words:
- employee
- employees
- workforce
- staff
- headcount
- expat
- national
- nationality
- personnel
- manpower
- phase
- scope
- contract
- advantage
- concern
- discussed
- discuss
- transcript
- meeting
- raised
- mentioned
- agenda
- action item

# ── Routing: words that trigger SQL routing ───────────────────────────────────
trigger_words:
- how many
- count
- total wells
- list all
- list wells
- which rig
- which well
- average progress
- progress of
- status of
- wells in
- wells on
- wells by
- wells with
- completed wells
- in progress
- rig on
- rig off
- overall progress
- percent
- overdue
- delayed
- behind schedule
- ahead of schedule
- on track
- top wells
- bottom wells
- most wells
- least wells
- lowest progress
- highest progress
- breakdown
- summary
- per rig
- cellar progress
- access road
- flowline
- earthwork
- engineering progress
- commissioning
- location prep
- february
- well id
- well location
- rig no
- rig number
- pdo well
- location of well
- which rig is
# Column names (well_name_after_spud, pdo_well_id, etc.) are auto-added as trigger
# words in Python from allowed_columns — no need to list them here.
- well name
- activity code
- activity master
- production norm
- productivity norm
- qty/hr
- qty per hour
- crew group
- activity description
- norm for
- find activity
- look up activity
- which activity
- buffer status
- buffer
- nimr cluster
- rol status
- drilled status
- vmb report
# tables — one entry per data source loaded by 09_universal_ingest.py.
# Columns and row counts come from the live DB at startup (_load_live_schema).
# Never hard-code column names here — they become stale after any ingest run.
#
# Ingest fields (read by 09_universal_ingest.py):
#   type        sql | workforce   (omit to skip ingest for legacy-loaded tables)
#   dir         CSV | EXCEL       (sub-folder under data/)
#   source_file filename          (exact filename in data/<dir>/)
#   sheet       sheet name        (Excel only; omit to use the first sheet)
#   header_row  0-based int       (default 0; use >0 to skip merged title rows)
tables:

  # ── CSV sources ──────────────────────────────────────────────────────────────
  - name: well_monitoring
    source_file: POC 1 WellMonitoringReport_Feb_Data_VERIFIED.csv
    dir: CSV
    type: sql
    description: Well monitoring report — one row per well with 128 operational columns
      including rig, progress, dates, flowline, cellar, and commissioning status.

  - name: project_ids
    source_file: POC 1 ProjectIDs_VERIFIED.csv
    dir: CSV
    type: sql
    description: Project ID lookup table mapping project codes to names and descriptions.

  - name: daily_plan
    source_file: Daily_Plan.csv
    dir: CSV
    type: sql
    description: Daily activity plan with planned vs actual activity timelines.

  # ── Excel sources ─────────────────────────────────────────────────────────────
  - name: task_plan
    source_file: Task_Plan.xlsx
    dir: EXCEL
    sheet: Task_Plan
    header_row: 0
    type: sql
    description: Well task plan — activities, durations, progress, and start dates for each milestone.

  - name: crew_master
    source_file: Crew Master_VERIFIED.xlsx
    dir: EXCEL
    sheet: Sheet1
    header_row: 0
    type: sql
    description: Crew master list — crew group names, formations, PG/EG codes, and quantities.

  - name: well_master
    source_file: "Well Master _ Nimr _ 2026_VERIFIED.xlsx"
    dir: EXCEL
    sheet: Sheet1
    header_row: 2
    type: sql
    description: Well master list for Nimr 2026 — well IDs, locations, and well attributes.

  - name: activity_master
    source_file: Activity Master_VERIFIED.xlsx
    dir: EXCEL
    sheet: Activity Master
    header_row: 2
    type: sql
    description: Activity master — productivity norms for civil, mechanical, and E&I activities.

  - name: job_progress
    source_file: Job Progress Report-Nimr.xlsx
    dir: EXCEL
    sheet: Job Progress (Nimr)
    header_row: 4
    type: sql
    description: Job progress report for Nimr — activity-level progress tracking.

  - name: daily_plan_nimr
    source_file: DailyPlan-Nimr.xlsx
    dir: EXCEL
    sheet: Daily Plan (Nimr)
    header_row: 4
    type: sql
    description: Daily plan for Nimr field operations.

  - name: ph_productivity
    source_file: PH_Productivity_Nimr_2026-05-10.xlsx
    dir: EXCEL
    sheet: PH_Productivity
    header_row: 0
    type: sql
    description: Person-hour productivity data for Nimr operations (May 2026).

  - name: well_delivery_kpis
    source_file: "Well Delivery Core KPIs (1) (1).xlsx"
    dir: EXCEL
    sheet: KPIs
    header_row: 1
    type: sql
    description: Well delivery core KPIs — 13 KPI metrics with Nimr and Marmul counts for
      pegged locations, FLAFs issued, rig-on schedule compliance, and delivery milestones.

  - name: construction_delivery
    source_file: "Operational Charts - Construction - WD Dashboard (1).xlsx"
    dir: EXCEL
    sheet: PDO MGT Delivery Table - W
    header_row: 0
    type: sql
    description: Construction delivery table — well delivery management data with 87 operational columns.

  - name: wmr_nimr
    source_file: WMR-Nimr.xlsx
    dir: EXCEL
    sheet: WMR
    header_row: 5
    type: sql
    description: Nimr Cluster Well Monitoring Report (May 2026) — 370 wells with buffer
      status, progress, rig assignment, PDO well ID, pegged dates, and construction milestones.

  # ── Workforce dashboard (embeddings, not SQL) ─────────────────────────────────
  - name: workforce
    source_file: Mockup Dashboard with Drilldown 04032026_VERIFIED.xlsx
    dir: EXCEL
    type: workforce
    description: AL TASNIM workforce dashboard — headcount by nationality, category, and employment type.
    # Extraction schema — every column name and category label from the Excel file.
    # Update these here if the Excel structure changes; no Python changes needed.
    sheet: Base Data
    dedup_chart_col: "Chart List"
    dedup_chart_value: "Nationality Wise Employee Count"
    nationality_col: "Nationality"
    expat_label: "Expats"
    category_col: "POS Category"
    employment_col: "ATNM / Hired"
    id_col: "Personnel Number"
    labour_label: "Labour"
    staff_label: "Staff"
    atnm_label: "ATNM"
    hired_label: "Hired"

  # ── Legacy tables (loaded via separate pipeline — ingest skips these) ─────────
  - name: operational_wells
    source_file: ACC Dump
    description: Operational wells table — 483 wells across 27 fields (AL BURJ, NIMR, AMAL SOUTH,
      etc.) with rig assignment, well function, and well type.

  - name: operational_tasks
    source_file: Task_Plan.xlsx
    description: Operational task tracking — 44,235 milestone and activity records per well
      including Flowline Start/Finish, Hook Up, Rig-On/Off, Surveying, Grading, with
      progress (1.0=done, 0.0=pending).
intents:
  # ── well_monitoring table ───────────────────────────────────────────────────
  well_count:
    description: Count how many wells match a categorical filter (rig name, well type,
      location name). Do NOT use for numeric range filters — use progress_range for that.
    sql_type: count

  well_list:
    description: List wells with key operational fields, optionally filtered by rig,
      well type, or status.
    sql_type: list
    order_by: "over_all_progress_percentages DESC"
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_type
    - over_all_progress_percentages
    - location_preparation_status_in_progress_completed
    - actual_rig_on_date
    - actual_rig_off_date
    default_limit: 20

  progress_range:
    description: Count wells whose overall progress percentage falls within a numeric
      range, e.g. between 50% and 80%.
    sql_type: range
    range_column: over_all_progress_percentages

  rig_summary:
    description: Per-rig breakdown — well counts and average progress per rig.
      Use ONLY for well counts per rig; use progress_summary for highest/lowest progress.
    sql_type: group_by
    default_group_by: rig_no
    aggregate_column: over_all_progress_percentages
    default_limit: 10

  progress_summary:
    description: Which rig/well_type/week has the highest or lowest average progress.
    sql_type: group_by
    aggregate_column: over_all_progress_percentages
    allowed_group_by:
    - rig_no
    - well_type
    - week_number
    default_limit: 20

  top_wells:
    description: Top or bottom N wells ranked by overall progress percentage.
    sql_type: ranked
    rank_column: over_all_progress_percentages
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_type
    - over_all_progress_percentages
    default_limit: 10

  status_breakdown:
    description: Count wells grouped by a status column (location prep, flowline
      construction, commissioning).
    sql_type: status_breakdown
    allowed_status_columns:
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
    - flow_line_commi_status_in_progress_completed

  well_detail:
    description: Full details for a specific well, looked up by well name or PDO well ID.
    sql_type: detail
    id_column: pdo_well_id
    name_column: well_name_after_spud
    select_columns:
    - rig_no
    - well_name_after_spud
    - well_location
    - well_type
    - pdo_well_id
    - over_all_progress_percentages
    - actual_rig_on_date
    - actual_rig_off_date
    - location_preparation_status_in_progress_completed
    - flow_line_const_status_in_progress_completed
    - remark_status_area_of_attention_issues

  # ── activity_master table ───────────────────────────────────────────────────
  activity_lookup:
    description: Look up activity details — production norms, qty/hr, duration,
      crew group, UOM — filtered by activity code, discipline, or keyword.
    sql_type: multi_filter
    table: activity_master
    order_by: "activity_code"
    fast_path_keywords:
    - activity code
    - qty/hr
    - qty per hour
    - production norm
    - productivity norm
    - activity master
    - norm for activity
    fast_path_extract: activity_code
    # Known values for the discipline column — used to extract the discipline from
    # a user question without hardcoding them in Python. Update if new disciplines added.
    known_discipline_values:
    - civil
    - mechanical
    - electrical
    - e&i
    select_columns:
    - discipline
    - activity_group_description
    - activity_code
    - activity_description
    - crew_group_name
    - duration_for_activity
    - duration_hrs
    - uom
    - qty_hr
    allowed_filter_columns:
    - activity_code
    - discipline
    - crew_group_name
    - activity_group_description
    default_limit: 10

  # ── wmr_nimr table ──────────────────────────────────────────────────────────
  nimr_detail:
    description: Nimr cluster well details — buffer status, progress, rig, pegged
      date, construction dates. Use for buffer status, nimr cluster, or Nimr-specific
      well queries.
    sql_type: multi_filter
    table: wmr_nimr
    order_by: "rig_no"
    fast_path_keywords:
    - buffer status
    - buffer
    - nimr cluster
    fast_path_extract: pdo_well_id
    select_columns:
    - rig_no
    - well_location
    - well_name_after_spud
    - pdo_well_id
    - well_type
    - buffer_status
    - actual_pegged_date
    - cum_progress_for_this_week
    - last_week_cum_progress
    - actual_rig_on_date
    - actual_rig_off_date
    - latest_exp_rig_on_location_sap_data
    allowed_filter_columns:
    - pdo_well_id
    - rig_no
    - well_location
    - buffer_status
    - well_type
    default_limit: 20

  nimr_buffer_count:
    description: Count Nimr wells grouped by buffer status (drilled, ROL, Buffer1,
      Buffer2). Use for questions like "how many wells are in ROL status".
    sql_type: count_by_column
    table: wmr_nimr
    group_column: buffer_status
    fast_path_keywords:
    - buffer breakdown
    - buffer count
    - how many buffer

  # ── well_delivery_kpis table ────────────────────────────────────────────────
  kpi_lookup:
    description: Well Delivery Core KPIs — 13 metrics comparing Nimr vs Marmul for
      pegged locations, FLAFs, rig-on dates, and delivery milestones.
    sql_type: multi_filter
    table: well_delivery_kpis
    order_by: "sr_no"
    fast_path_keywords:
    - kpi
    - flaf
    - pegged
    - rig on location
    - 90 days
    - kpi count
    - delivery kpi
    - marmul count
    - nimr count
    select_columns:
    - sr_no
    - kpis
    - nimr_count
    - marmul_count
    allowed_filter_columns:
    - sr_no
    - kpis
    default_limit: 13

  # ── crew_master table ────────────────────────────────────────────────────────
  crew_lookup:
    description: Crew group details — name, formation, PG/EG code, quantity,
      critical/support category, weightage.
    sql_type: multi_filter
    table: crew_master
    order_by: "crew_group_name"
    fast_path_keywords:
    - crew group
    - crew master
    - crew composition
    - crew formation
    - pg eg code
    - pg code
    - crew for
    - which crew
    - crew list
    select_columns:
    - crew_group_name
    - crew_formation
    - pg_eg_code
    - pg_eg_text
    - qty
    - critical_support
    - weightage
    allowed_filter_columns:
    - crew_group_name
    - pg_eg_code
    - critical_support
    default_limit: 20

  # ── well_master table ────────────────────────────────────────────────────────
  well_master_lookup:
    description: Nimr 2026 well master — field, well location, rig, well ID,
      and well function (Oil Producer / Water Injector).
    sql_type: multi_filter
    table: well_master
    order_by: "field, well_id"
    fast_path_keywords:
    - well master
    - nimr 2026
    - oil producer
    - water injector
    - well function
    select_columns:
    - station_code
    - field
    - well_location
    - rig_no
    - well_id
    - well_function
    allowed_filter_columns:
    - field
    - rig_no
    - well_id
    - well_function
    default_limit: 20

  # ── operational_wells table ──────────────────────────────────────────────────
  field_wells:
    description: Operational wells by field or rig — covers all fields and rigs.
      Use for which wells are in a specific field or which rigs operate in a field.
    sql_type: multi_filter
    table: operational_wells
    order_by: "field, rig_no"
    fast_path_keywords:
    - which field
    - wells in field
    - field wells
    - rig in field
    - well location in
    - station code
    - well function
    select_columns:
    - well_id
    - station_code
    - field
    - well_location
    - rig_no
    - well_function
    - well_type
    allowed_filter_columns:
    - field
    - rig_no
    - well_function
    - well_type
    default_limit: 20

  # ── operational_tasks table ──────────────────────────────────────────────────
  milestone_status:
    description: Milestone and activity completion per well (44,235 records).
      progress=1.0 means done, 0.0 means pending. Use for milestone status queries.
    sql_type: multi_filter
    table: operational_tasks
    order_by: "well_id, code"
    fast_path_keywords:
    - milestone status
    - task status
    - flowline start
    - flowline finish
    - hook up start
    - hook up finish
    - rig-on status
    - rig-off status
    - ms1000
    - mil2000
    - flcv
    - surveying status
    - milestones for well
    - tasks for well
    fast_path_extract: well_id
    select_columns:
    - well_id
    - code
    - text
    - type
    - progress
    - start_date
    - end_date
    allowed_filter_columns:
    - well_id
    - code
    - type
    default_limit: 30
