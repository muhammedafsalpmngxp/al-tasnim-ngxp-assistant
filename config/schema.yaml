      - 'Document: NGXP Phase1 Master Guide 22May2026.docx (NGXP) | Chunk 43

        Content:

        FLAF rule correction (BR-01 to BR-05). The WMR view today flags FLAF=NULL as an exception. The corrected rule excludes
        special wells (ESP, OP/PI, WI) and all on-plot work from FLAF-required scope. The WMR widget must be filtered, not
        the underlying view (per Anand: "filter the values, remove the blanks").


        Backlog formula clarification (BR-15, BR-16). Backlog is against PLAN, not against accelerated. Accelerated wells
        are a separate counter. The view today may not split these cleanly — Akash to confirm.


        Dynamic norm extension (BR-26, BR-27). PH_Productivity today uses static norms. Anand wants dynamic norms based on
        critical/support resource split. Phase 1 may need to ship static norms with a Phase 2 commitment to dynamic norms.


        GB-cluster generalisation. Job_Progress_Report_GB and Daily_Plan_Report_GB must be replicated for Nimr / Marmul /
        Amal. The CASE expression for well-type cleansing must be tested against those clusters'' description patterns (silent
        miscategorisation risk → "LOC" catch-all).


