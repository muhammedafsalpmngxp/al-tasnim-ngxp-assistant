        CASE


        WHEN LOWER(pid.column2) LIKE ''%conversion without%''


        OR LOWER(pid.column2) LIKE ''%cof%'' THEN ''COF''


        WHEN LOWER(pid.column2) LIKE ''%conversion with%''


        OR LOWER(pid.column2) LIKE ''%cwf%'' THEN ''CWF''


        WHEN LOWER(pid.column2) LIKE ''%non-standard%''


        OR LOWER(pid.column2) LIKE ''%nsw%'' THEN ''NSW''


        WHEN LOWER(pid.column2) LIKE ''%reopen with%'''
